[package]
name = "nbs-rust"
version = "0.1.0"
authors = ["KNSN92"]
description = "A Rust library for IO and rendering audio of .nbs files."
edition = "2024"

[features]
audio = ["lru", "rubato", "symphonia"]
midi = ["midly"]
zip = ["dep:zip"]
serde = ["dep:serde"]

[dependencies]
byteorder = "1.5.0"
crossbeam-channel = "0.5.15"
lru = { version = "0.18.0", optional = true }
midly = { version = "0.5.3", optional = true }
rubato = { version = "5.0.0", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
symphonia = { version = "0.5.5", optional = true }
thiserror = "2.0.18"
wide = "1.5.0"
zip = { version = "0.6.6", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "note_audio_bench"
required-features = ["audio"]
harness = false
